name: eidos-prediction-experiments
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 */2 * * 1-5'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e eidos/repo
      - run: python -m pip install pytest pyyaml
      - run: pytest eidos/repo/tests -q
      - run: python -m eidos_brain.prediction.run_world_telemetry --fixture --out artifacts/predictions/world_telemetry
      - run: python -m eidos_brain.prediction.run_market_forecast --fixture --out artifacts/predictions/market_forecast
      - run: python -m eidos_brain.prediction.evaluate_due_predictions --ledger artifacts/predictions/ledger --out artifacts/predictions/evaluations
      - uses: actions/upload-artifact@v4
        with: {name: prediction-artifacts, path: artifacts/predictions}
      - name: Optional google drive sync
        run: |
          if [ -z "${RCLONE_CONFIG_DRIVE:-}" ]; then
            echo "RCLONE_CONFIG_DRIVE missing; skipping"
          else
            printf '%s' "$RCLONE_CONFIG_DRIVE" > /tmp/rclone.conf
            curl -fsSL https://rclone.org/install.sh | sudo bash
            rclone --config /tmp/rclone.conf copy artifacts/predictions "$EIDOS_GDRIVE_REMOTE_PATH"
          fi
        env:
          RCLONE_CONFIG_DRIVE: ${{ secrets.RCLONE_CONFIG_DRIVE }}
          EIDOS_GDRIVE_REMOTE_PATH: ${{ secrets.EIDOS_GDRIVE_REMOTE_PATH }}
      - name: Commit compact artifacts
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add artifacts/predictions/ledger artifacts/predictions/world_telemetry artifacts/predictions/market_forecast || true
          git commit -m "chore: update prediction artifacts" || true
          git push
