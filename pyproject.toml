[project]
name = "eidos-agent-lab"
version = "0.1.0"
description = "Proof-first multi-agent research orchestration for Eidos Brain"
requires-python = ">=3.12"
dependencies = [
  "openai-agents>=0.22.2,<0.23",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
eidos-agents = "eidos_agents.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eidos_agents"]

[tool.pytest.ini_options]
testpaths = ["tests/agent_lab"]
addopts = "-q"
markers = ["live: paid OpenAI API smoke tests, disabled by default"]
