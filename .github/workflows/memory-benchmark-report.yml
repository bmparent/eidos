name: Controlled memory report
on:
  pull_request:
    paths:
      - "proof/memory_report.py"
      - "tests/test_memory_report_partial.py"
      - ".github/workflows/memory-benchmark-report.yml"
permissions:
  contents: read
jobs:
  partial-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy matplotlib pytest
      - run: python -m pytest tests/test_memory_report_partial.py -q
