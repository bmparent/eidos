name: Sentinel Lab quality
on:
  pull_request:
    paths: ['apps/sentinel-lab/**', '.github/workflows/sentinel-lab-quality.yml']
  push:
    branches: [main]
    paths: ['apps/sentinel-lab/**', '.github/workflows/sentinel-lab-quality.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sentinel-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/sentinel-lab/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
