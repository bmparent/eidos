name: Sentinel Lab quality
on:
  pull_request:
    paths: ['apps/sentinel-lab/**', 'services/sentinel-runner/**', 'eidos/EIDOS_BRAIN_UNIFIED_v0_4.7.02.py', 'eidos/repo/src/eidos_brain/**', '.github/workflows/sentinel-lab-quality.yml']
  push:
    branches: [main]
    paths: ['apps/sentinel-lab/**', 'services/sentinel-runner/**', 'eidos/EIDOS_BRAIN_UNIFIED_v0_4.7.02.py', 'eidos/repo/src/eidos_brain/**', '.github/workflows/sentinel-lab-quality.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sentinel-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/sentinel-lab/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/sentinel-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/sentinel-runner/pyproject.toml
      - run: python -m pip install uv
      - run: uv pip install --python "$pythonLocation/bin/python" --no-cache --torch-backend cpu .
      - run: python -c "import torch; assert torch.__version__.split('+')[0] == '2.14.0'; assert torch.version.cuda is None"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_full_engine.py --profile cpu_engineering --output /tmp/eidos-standard
      - run: python scripts/verify_full_engine.py --profile cpu_mechanisms --output /tmp/eidos-mechanisms
