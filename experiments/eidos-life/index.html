<!doctype html><html><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Eidos Life v0.2</title>
<style>body{margin:0;background:#060913;color:#e6f0ff;font-family:Inter,system-ui} .hud{position:fixed;left:14px;top:14px;z-index:10;background:rgba(8,13,23,.8);padding:12px;border-radius:12px;border:1px solid #2b3d62;width:380px} .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:13px}.timeline{margin-top:8px;font-size:11px;color:#a9bad8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px} .toggles{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;font-size:12px}</style>
<script type='importmap'>{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script></head>
<body><div class='hud'><strong>Eidos Life v0.2 / Living Stream Lab</strong><div id='generation'>gen 0</div><div>Regime: <span id='regimeLabel'>CALIBRATING</span></div>
<div class='grid'><div>Surprise <span id='surprise'>0</span></div><div>Entropy <span id='entropy'>0</span></div><div>Compression <span id='compression'>0</span></div><div>Plasticity <span id='plasticity'>0</span></div><div>Alive <span id='aliveRatio'>0</span></div><div>Organisms <span id='organisms'>0</span></div></div>
<div class='controls'><button id='pauseBtn'>Pause</button><button id='seedBtn'>Seed</button><button id='pulseBtn'>Eidos Pulse</button></div><div class='controls'><button id='exportBtn'>Export Bundle</button><select id='scenarioSelect'></select><span></span></div>
<div class='toggles'><label><input id='toggleSurprise' type='checkbox' checked/> surprise heatmap</label><label><input id='toggleMemory' type='checkbox' checked/> memory trails</label><label><input id='toggleEnergy' type='checkbox'/> energy field</label><label><input id='toggleOutlines' type='checkbox' checked/> organism outlines</label></div>
<div class='timeline' id='timeline'></div></div>
<script type='module' src='./src/app.js'></script></body></html>
