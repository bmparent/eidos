[project]
name = "eidos-sentinel-runner"
version = "0.2.1"
description = "Process-isolated full-engine runner for Sentinel Lab real-data experiments"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "kagglehub>=0.3.12,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pyarrow>=17,<24",
  "torch==2.14.0",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
eidos-sentinel-job = "sentinel_runner.cli:main"
eidos-guided-job = "sentinel_runner.guided.cli:main"

[project.optional-dependencies]
guided = [
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "scikit-learn>=1.6,<2",
  "sentence-transformers>=4.1,<6",
  "psutil>=5.9,<8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_runner"]
